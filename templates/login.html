<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="login-page"><div class="login-card"><div class="brand">STUDENT ACADEMIC PORTAL</div><h1>Student Login</h1><p class="muted">Sign in to view your academic performance.</p>{% if error %}<div class="alert error">{{error}}</div>{% endif %}<form method="post"><label>Student ID</label><input name="student_id" required><label>Password</label><input type="password" name="password" required><button class="btn primary full">Login</button></form><div class="login-note">Default password: <b>StudentID@123</b></div><a class="admin-link" href="{{url_for('admin_login')}}">Admin Login</a></div></body></html>
